<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Emerging Industries</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css?v=2.1">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="margin: 0; padding: 0; overflow-x: hidden;">

    <div style="position: absolute; top: 30px; left: 40px; z-index: 10;">
        <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px; font-family: 'Josefin Sans', sans-serif; font-size: 1.1rem; font-weight: 500;">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <div class="auth-container">
        <!-- Left Panel -->
        <div class="auth-left" style="background-image: url('assets/image 87.webp');" data-aos="fade-right" data-aos-duration="1000">
            <div class="auth-left-content">
                <h1 class="auth-huge-title" style="color: white;"><span style="color: rgba(255,255,255,0.4);">SIGN</span> <span style="color: #fff;">UP</span></h1>
                <h2 class="auth-subtitle" style="color: white;">FIND YOUR OWN WAY</h2>
                <p class="auth-desc" style="color: white;">Schedule as a soon playh visit in just a few click<br>fhfieuby iyje uwynf Continue with Facebook<br>visits in just in your minda few click</p>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="auth-right auth-signup-bg" style="background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)), url('assets/image 101.webp');" data-aos="fade-left" data-aos-duration="1000">
            <div class="auth-right-content">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <img src="assets/Brand-logo.webp?v=2.1" alt="Emerging Industries" style="height: 75px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">
                </div>
                <h2 class="auth-welcome">Create Account</h2>
                <h3 class="auth-action-title" style="font-family: 'Josefin Sans', sans-serif; font-weight: 400; font-size: 1.3rem;">Join stackly for exclusive offers</h3>

                <form class="auth-form" id="signupForm">
                    <div class="auth-form-group">
                        <label style="display:block; margin-bottom: 8px; color: #8B98AA; font-size: 0.95rem;">Login As</label>
                        <select class="auth-input auth-input-select auth-input-glass" id="loginAs" required>
                            <option value="Admin">Admin</option>
                            <option value="Client">Client</option>
                        </select>
                    </div>
                    <div class="auth-form-group">
                        <input type="text" class="auth-input auth-input-glass" placeholder="Full Name" required>
                    </div>
                    <div class="auth-form-group">
                        <input type="email" class="auth-input auth-input-glass" id="loginEmail" placeholder="Email Address" required>
                    </div>
                    <div class="auth-form-group">
                        <input type="password" id="signupPassword" class="auth-input auth-input-glass" placeholder="Password" required>
                    </div>
                    <div class="auth-form-group">
                        <input type="password" id="signupConfirmPassword" class="auth-input auth-input-glass" placeholder="Confirm Password" required>
                    </div>

                    <button type="submit" class="auth-submit-btn">Sign Up</button>
                    
                    <div class="auth-back-wrapper" style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
                        <button type="button" class="auth-back-btn" onclick="window.location.href='index.html'">Back</button>
                        <p style="margin: 0; color: #fff; font-size: 0.9rem;">
                            Already have an account? <a href="login.html" style="color: var(--orange); text-decoration: none;">Sign in</a>
                        </p>
                    </div>

                    <div class="auth-divider">
                        <span>Instant Login</span>
                    </div>

                    <div class="auth-social-group">
                        <button type="button" class="auth-social-btn" onclick="window.location.href='404.html'">
                            <i class="fab fa-google" style="font-size: 16px;"></i>
                            Continue with Google
                        </button>
                        <button type="button" class="auth-social-btn" onclick="window.location.href='404.html'">
                            <img src="assets/ic_baseline-facebook.webp" alt="F" width="16" style="">
                            Continue with Facebook
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Passwords do not match. Please try again.');
            }
        });
    </script>
</body>
</html>
